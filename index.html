<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calctext</title>
<style>
  @font-face {
    font-family: "Cryptext v1";
    src: url("Cryptext02.ttf") format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "Cryptext v2";
    src: url("Cryptext25-Regular.ttf") format("truetype");
    font-display: swap;
  }

  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --ink: #1b1b1f;
    --muted: #6b6b73;
    --line: #dcdad2;
    --accent: #3b3bd6;
    --accent-ink: #ffffff;
    --warn: #b4531a;
    --preview-ink: #111114;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --panel: #1e1e22;
      --ink: #ececf1;
      --muted: #9a9aa5;
      --line: #34343b;
      --accent: #8c8cff;
      --accent-ink: #12121a;
      --warn: #e8955a;
      --preview-ink: #f4f4f8;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 16px 64px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
  }
  .sub { margin: 0 0 24px; color: var(--muted); }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px 24px;
    align-items: flex-end;
    margin-bottom: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.grow { flex: 1 1 280px; }
  label, .label {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  textarea {
    width: 100%;
    resize: vertical;
    min-height: 3.2em;
    padding: 10px 12px;
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  textarea:focus-visible, .seg input:focus-visible + span, input[type=range]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .seg {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel);
  }
  .seg label {
    margin: 0;
    text-transform: none;
    letter-spacing: 0;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
  }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; padding: 10px 18px; }
  .seg label + label span { border-left: 1px solid var(--line); }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); }

  input[type=range] { width: 180px; accent-color: var(--accent); }

  #stage { display: flex; flex-direction: column; gap: 12px; }
  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 40px 24px 24px;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .tag {
    position: absolute;
    top: 12px;
    left: 16px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .out {
    margin: 0;
    width: 100%;
    text-align: center;
    color: var(--preview-ink);
    line-height: 1.15;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .out.v1 { font-family: "Cryptext v1", monospace; }
  .out.v2 { font-family: "Cryptext v2", monospace; }
  .out .miss { color: var(--warn); font-family: system-ui, sans-serif; opacity: 0.7; }
  .empty { padding: 32px 24px; text-align: center; color: var(--muted); }

  @media (max-width: 600px) {
    main { padding-top: 24px; }
    .card { padding: 36px 12px 16px; min-height: 130px; }
    input[type=range] { width: 100%; }
    .field:has(#size) { flex: 1 1 100%; }
  }

  .note { min-height: 1.5em; margin: 12px 0 0; font-size: 0.9rem; color: var(--warn); }
  .note:empty { display: none; }
</style>
</head>
<body>
<main>
  <h1>Calctext</h1>
  <p class="sub">Type a word. See it in Calctext.</p>

  <div class="controls">
    <div class="field grow">
      <label for="text">Your text</label>
      <textarea id="text" rows="2" placeholder="Type here…" autofocus spellcheck="false">Calctext</textarea>
    </div>

    <div class="field">
      <span class="label" id="ver-label">Version</span>
      <div class="seg" role="radiogroup" aria-labelledby="ver-label">
        <label><input type="radio" name="ver" value="v1"><span>v1</span></label>
        <label><input type="radio" name="ver" value="v2"><span>v2</span></label>
        <label><input type="radio" name="ver" value="both" checked><span>Both</span></label>
      </div>
    </div>

    <div class="field">
      <span class="label" id="case-label">Case</span>
      <div class="seg" role="radiogroup" aria-labelledby="case-label">
        <label><input type="radio" name="case" value="typed"><span>As typed</span></label>
        <label><input type="radio" name="case" value="lower"><span>lower</span></label>
        <label><input type="radio" name="case" value="upper"><span>UPPER</span></label>
        <label><input type="radio" name="case" value="both" checked><span>Both</span></label>
      </div>
    </div>

    <div class="field">
      <label for="size">Size <output id="size-val">72</output>px</label>
      <input id="size" type="range" min="24" max="240" step="4" value="72">
    </div>
  </div>

  <div id="stage" aria-live="polite"></div>
  <p class="note" id="note"></p>
</main>

<script>
  // Glyphs actually present in each font file.
  const SUPPORTED = {
    v1: (c) => {
      const n = c.codePointAt(0);
      return n === 0x20 || (n > 0x20 && n < 0x7f) || (n > 0xa0 && n <= 0xff) || n === 0x131;
    },
    v2: (c) => /[A-Za-z0-9:;? ]/.test(c),
  };
  const V2_HINT = "v2 only has A–Z, 0–9, : ; ? and space. Other characters are shown dimmed in a fallback font.";

  const CASES = {
    typed: { label: "as typed", fn: (s) => s },
    lower: { label: "lowercase", fn: (s) => s.toLowerCase() },
    upper: { label: "UPPERCASE", fn: (s) => s.toUpperCase() },
  };

  const $ = (id) => document.getElementById(id);
  const text = $("text"), stage = $("stage"), note = $("note");
  const size = $("size"), sizeVal = $("size-val");

  const picked = (name) => document.querySelector(`input[name="${name}"]:checked`).value;

  // Returns true if any char had no glyph in the chosen font.
  function fill(el, str, v) {
    el.replaceChildren();
    let missing = false;
    let run = "";
    const flush = () => { if (run) { el.append(run); run = ""; } };
    for (const ch of str) {
      if (ch === "\n" || SUPPORTED[v](ch)) { run += ch; continue; }
      flush();
      const s = document.createElement("span");
      s.className = "miss";
      s.textContent = ch;
      el.append(s);
      missing = true;
    }
    flush();
    return missing;
  }

  function render() {
    const value = text.value;
    const versions = picked("ver") === "both" ? ["v1", "v2"] : [picked("ver")];
    const cases = picked("case") === "both" ? ["lower", "upper"] : [picked("case")];

    stage.replaceChildren();
    note.textContent = "";

    if (!value) {
      const p = document.createElement("div");
      p.className = "card empty";
      p.textContent = "Your text will appear here.";
      stage.append(p);
      return;
    }

    let v2Missing = false;
    for (const v of versions) {
      for (const c of cases) {
        const card = document.createElement("div");
        card.className = "card";

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = `${v} · ${CASES[c].label}`;

        const out = document.createElement("pre");
        out.className = `out ${v}`;
        out.style.fontSize = size.value + "px";
        if (fill(out, CASES[c].fn(value), v) && v === "v2") v2Missing = true;

        card.append(tag, out);
        stage.append(card);
      }
    }
    if (v2Missing) note.textContent = V2_HINT;
  }

  // Smaller starting size on phones so words don't wrap mid-word.
  if (matchMedia("(max-width: 600px)").matches) {
    size.value = 40;
    sizeVal.textContent = size.value;
  }

  text.addEventListener("input", render);
  size.addEventListener("input", () => { sizeVal.textContent = size.value; render(); });
  document.querySelectorAll('input[name="ver"], input[name="case"]').forEach((r) => r.addEventListener("change", render));
  render();
</script>
</body>
</html>
